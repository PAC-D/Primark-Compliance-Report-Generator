# Include inside the primark server block (443) in /etc/nginx/sites-enabled/primark:
#   include /srv/primark-projects/Primark-Compliance-Report-Generator/deploy/nginx-compliance.conf;
# Next.js (basePath /compliance) serves /compliance itself and redirects /compliance/ to it,
# so /compliance goes to the app too; a redirect here would loop with Next's.
location = /compliance {
    auth_basic "TPS Compliance"; auth_basic_user_file /etc/nginx/tps-compliance.htpasswd;
    proxy_pass http://127.0.0.1:8601;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
}
location /compliance/api/ {
    auth_basic "TPS Compliance"; auth_basic_user_file /etc/nginx/tps-compliance.htpasswd;
    client_max_body_size 50m; proxy_read_timeout 900s;
    proxy_pass http://127.0.0.1:8602/api/;
    proxy_set_header Authorization ""; proxy_set_header Host $host; proxy_set_header Origin $http_origin;
}
location /compliance/ {
    auth_basic "TPS Compliance"; auth_basic_user_file /etc/nginx/tps-compliance.htpasswd;
    proxy_pass http://127.0.0.1:8601;
    proxy_set_header Authorization "";
    proxy_set_header Host $host;
}
